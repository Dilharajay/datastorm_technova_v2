[project]
name = "technova-datastorm-v4"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "geopandas>=1.1.3",
    "ipykernel>=7.2.0",
    "jupyter>=1.1.1",
    "lightgbm>=4.0.0",
    "matplotlib>=3.10.9",
    "nbconvert>=7.17.1",
    "nbformat>=5.10.4",
    "numpy>=2.4.6",
    "pandas>=3.0.3",
    "pandas-stubs~=3.0.3",
    "pyarrow>=24.0.0",
    "scikit-learn>=1.6.0",
    "scipy>=1.17.1",
    "statsmodels>=0.14.0",
    "torch>=2.0.0",
    "xgboost>=3.2.0",
]

[tool.ruff.lint]
per-file-ignores = { "*.ipynb" = ["E402"] }

[dependency-groups]
dev = [
    "ipykernel>=7.2.0",
    "ruff>=0.15.15",
]
